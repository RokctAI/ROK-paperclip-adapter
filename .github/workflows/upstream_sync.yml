name: Upstream Sync (Weekly)

on:
  schedule:
    - cron: '0 0 * * 0' # Run every Sunday at midnight
  workflow_dispatch: # Support manual triggering from the GitHub Actions tab

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Sync Upstream Main Branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ROK-paperclip-adapter Main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean Main Branch (Exclude .github and .rokct)
        run: |
          echo "🧹 Cleaning main branch files..."
          # Delete everything in the working directory except git metadata, workflow files, and .rokct folder
          find . -maxdepth 1 ! -name '.' ! -name '..' ! -name '.git' ! -name '.github' ! -name '.rokct' -exec rm -rf {} +
          echo "Working directory cleaned. Current files:"
          ls -la

      - name: Clone Upstream Repository Main Branch
        run: |
          echo "📦 Fetching latest changes from upstream main branch..."
          git clone --depth=1 https://github.com/NousResearch/hermes-paperclip-adapter.git temp_upstream
          # Copy all files except git repository metadata
          rsync -av --exclude='.git' temp_upstream/ .
          rm -rf temp_upstream
          echo "Extraction complete. Current files:"
          ls -la

      - name: Run Washlist Rebranding sweeps
        run: |
          echo "🧼 Running Washlist rebranding sweeps..."
          python .rokct/.washlist/washlist_run.py

      - name: Commit and Push Upstream Updates to Main
        id: git-commit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "chore: sync latest upstream commits from hermes-paperclip-adapter"
            git push origin main
            echo "changes_pushed=true" >> $GITHUB_OUTPUT
          else
            echo "No changes found. Already up-to-date with upstream."
            echo "changes_pushed=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request to Rokct
        if: steps.git-commit.outputs.changes_pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Verify if the head branch (main) is ahead of the base branch (rokct)
          # Check if base branch 'rokct' exists in remote
          if git show-ref --verify --quiet refs/remotes/origin/rokct; then
            PR_EXISTS=$(gh pr list --head main --base rokct --state open --json number -q '.[0].number')
            if [ -z "$PR_EXISTS" ]; then
              echo "🚀 Creating Pull Request to branch 'rokct'..."
              gh pr create \
                --title "chore: merge upstream latest commits into rokct" \
                --body "### Upstream Main Synchronization
                
                This is an automated weekly Pull Request syncing the latest main branch commits from upstream **NousResearch/hermes-paperclip-adapter**.
                
                Any custom ROKCT adaptations are preserved in the **rokct** branch, so this PR can be reviewed and merged conflict-free." \
                --head main \
                --base rokct
            else
              echo "⚠️ An open Pull Request already exists: #$PR_EXISTS. Skipping PR creation."
            fi
          else
            echo "ℹ️ Remote branch 'rokct' does not exist. Pushed directly to 'main' branch."
          fi
